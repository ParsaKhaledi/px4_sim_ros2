    Rtabmap:
      profiles: [slam]
      image: "${registry}/px4_sim:${px4TAG:?error}"
      container_name: rtabmap
      hostname: rtabmap
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "/home/px4/volume/HealthCheck/check_multi_topic_pub.bash", "1",
              "/rtabmap/odom"] 
      depends_on:
        PX4:
          condition: service_healthy
        StatePublisher:
          condition: service_started
        # uxrcedds:
        #   condition: service_healthy
      tty: true
      # network_mode: "host"
      networks:
        px4:
          ipv4_address: "10.20.10.8"
      # restart: unless-stopped
      environment:
        - DISPLAY=${DISPLAY}
        - XAUTHORITY=${XAUTH}
        - CameraType=${CameraType}

      volumes:
        - /tmp/.X11-unix/:/tmp/.X11-unix/
        - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
        - ./includes/gz/:/home/px4/volume/includes/gz/
        - ./includes/gz/startFiles/:/home/px4/volume/startFiles
        - ./includes/gz/Params:/home/px4/volume/Params

      # command: /bin/bash -c "sleep inf"

      command: /bin/bash -c "
        . /home/px4/volume/startFiles/gz_start_rtabmap.sh ${CameraType}"

    NAV2:
      profiles: [nav]
      image: "${registry}/px4_sim:${px4TAG:?error}"
      container_name: nav2
      hostname: nav2
      restart: unless-stopped
      depends_on:
        PX4:
          condition: service_healthy
        Rtabmap:
          condition: service_started
      tty: true
      # network_mode: "host"
      networks:
        px4:
          ipv4_address: "10.20.10.9"
      environment:
        DISPLAY: ${DISPLAY}
        "XAUTHORITY": ${XAUTH}
      volumes:
        - /tmp/.X11-unix/:/tmp/.X11-unix/
        - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
        - ./includes/gz/:/home/px4/volume/includes/gz/
        - ./includes/gz/startFiles/:/home/px4/volume/startFiles
        - ./includes/gz/Params:/home/px4/volume/Params
      
      # command: /bin/bash -c "sleep inf"

      command: /bin/bash -c "
        ros2 launch nav2_bringup navigation_launch.py use_sim_time:=${USE_SIM_TIME:-true} \
        params_file:=/home/px4/volume/Params/nav2/nav2_params.yaml"
        

    Nav2_Rviz:
      profiles: [nav]
      image: "${registry}/px4_sim:${px4TAG:?error}"
      container_name: nav2_rviz
      hostname: nav2_rivz
      tty: true
      privileged: true
      restart: unless-stopped
      depends_on:
        NAV2:
          condition: service_started
      # network_mode: "host"
      networks:
        px4:
          ipv4_address: "10.20.10.10"

      environment:
        DISPLAY: ${DISPLAY}
        XAUTHORITY: ${XAUTH}
          
      volumes:
        - /tmp/.X11-unix/:/tmp/.X11-unix/
        - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
        - ./includes/gz/Params:/home/px4/volume/Params

      # command: /bin/bash -c "sleep inf"

      command: /bin/bash -c "
        /home/px4/volume/startFiles/start_nav2_rviz.sh"


networks:
  px4:
    ipam:
      driver: default
      config:
        - subnet: "10.20.10.0/24"
      

