services:
    PX4:
      image: "${registry}/px4_sim:${px4TAG:?error}"
      container_name: px4_sim
      hostname: px4_sim
      tty: true
      privileged: true
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "/home/px4/volume/HealthCheck/check_multi_topic_pub.bash", "2",
              "/clock", "/fmu/out/vehicle_odometry" ]      
        interval:     10s
        timeout:      5s
        retries:      3
        start_period: 15s
        
      # network_mode: "host"
      networks:
        px4:
          ipv4_address: "10.20.10.2"
      ports:
        - "5760:5760"
        # - "14550:14550/udp"
        - "14550:14550/udp"
        - "14540:14540/udp"
        - "14580:14580/udp"
        - "18570:18570/udp"
        - "8888:8888"

      environment:
        DISPLAY: ${DISPLAY}
        XAUTHORITY: ${XAUTH}
        CameraType: ${CameraType:-rgbd}
        World: ${World:-default}
        IMU_SOURCE: ${IMU_SOURCE:-oak}
        IMU_STAMP_MODE: ${IMU_STAMP_MODE:-receive}
        XRCE_DDS_AGENT_IP: "10.20.10.7"
        HEADLESS: ${HEADLESS:-0}
        HEADLESS_BACKEND: ${HEADLESS_BACKEND:-egl}
        HEADLESS_SOFTWARE: ${HEADLESS_SOFTWARE:-0}
        PX4_GZ_MODEL_POSE: ${PX4_GZ_MODEL_POSE:-}
        USE_SIM_TIME: ${USE_SIM_TIME:-true}
        # Empty lets the preflight node pick 0.15 under HEADLESS_SOFTWARE, else 0.8.
        PREFLIGHT_MIN_RTF: ${PREFLIGHT_MIN_RTF:-}
        PREFLIGHT_MAX_POSE_ERR_M: ${PREFLIGHT_MAX_POSE_ERR_M:-0.10}
        # Empty lets camera/IMU minimums follow CAM_RATE_HZ, IMU_RATE_HZ, or VISION_PROFILE.
        PREFLIGHT_MIN_CAMERA_HZ: ${PREFLIGHT_MIN_CAMERA_HZ:-}
        PREFLIGHT_MIN_IMU_HZ: ${PREFLIGHT_MIN_IMU_HZ:-}
        PREFLIGHT_MIN_GT_HZ: ${PREFLIGHT_MIN_GT_HZ:-20}
        PREFLIGHT_CLOCK_MAX_AGE_S: ${PREFLIGHT_CLOCK_MAX_AGE_S:-1.0}
        PREFLIGHT_CAMERA_TOPIC: ${PREFLIGHT_CAMERA_TOPIC:-/camera/rgb/image_raw}
        PREFLIGHT_IMU_TOPIC: ${PREFLIGHT_IMU_TOPIC:-/imu}
        GT_CHILD_FRAME: ${GT_CHILD_FRAME:-base_link_gt}
        SIM_RTF_WINDOW_S: ${SIM_RTF_WINDOW_S:-5}
        PREFLIGHT_GT_TOPIC: ${PREFLIGHT_GT_TOPIC:-/ground_truth/odom}
        # Spawn coordinate (Amirkabir aerospace dept). Not the world origin.
        SIM_ORIGIN_LAT: ${SIM_ORIGIN_LAT:-35.7048378}
        SIM_ORIGIN_LON: ${SIM_ORIGIN_LON:-51.4095049}
        SIM_ORIGIN_ALT: ${SIM_ORIGIN_ALT:-1205}
          
      volumes:
        - /tmp/.X11-unix/:/tmp/.X11-unix/
        - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
        - /dev/:/dev/
        - ./HealthCheck/:/home/px4/volume/HealthCheck/
        - ./includes/gz/:/home/px4/volume/includes/gz/
        - ./includes/gz/startFiles/:/home/px4/volume/startFiles/
        - ./includes/gz/Params:/home/px4/volume/Params/

      # command: /bin/bash -c "sleep inf"
      # entrypoint: ["/bin/sh", "-c"]

      # command: /bin/bash -c "
      #   . /home/px4/volume/includes/gz/gz_modifications.bash ${CameraType} && \
      #   /home/px4/volume/startFiles/gz_start_px4_gz_sim.sh ${World} &\
      #   /home/px4/volume/startFiles/gz_start_ros2_gz_bridge.sh & \
      #   /home/px4/volume/startFiles/gz_start_state_publisher.sh "

      command: /bin/bash -c "
        . /home/px4/volume/includes/gz/gz_modifications.bash ${CameraType} && \
        MicroXRCEAgent udp4 -p 8888 & \
        /home/px4/volume/startFiles/gz_start_px4_gz_sim.sh ${World} &\
        /home/px4/volume/startFiles/gz_start_ros2_gz_bridge.sh
        "

    StatePublisher:
      image: "${registry}/px4_sim:${px4TAG:?error}"
      container_name: statePublisher
      hostname: statePublisher
      tty: true
      privileged: true
      depends_on:
        PX4:
          condition: service_healthy
      restart: unless-stopped
      # network_mode: "host"
      networks:
        px4:
          ipv4_address: "10.20.10.3"

      # environment:
      #   DISPLAY: ${DISPLAY}
      #   XAUTHORITY: ${XAUTH}
          
      volumes:
        - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
        - ./includes/gz/:/home/px4/volume/includes/gz/
        - ./includes/gz/startFiles/:/home/px4/volume/startFiles
        - ./includes/gz/Params:/home/px4/volume/Params

      # command: /bin/bash -c "sleep inf"
      # entrypoint: ["/bin/sh", "-c"]

      command: /bin/bash -c "
        /home/px4/volume/startFiles/gz_start_state_publisher.sh"


    Qground:
      profiles: [gcs]
      image: "${registry}/px4_sim:${px4TAG:?error}"
      container_name: qground
      hostname: qground
      privileged: true
      restart: on-failure  
      tty: true
      # depends_on:
      #   - PX4
      # network_mode: "host"
      networks:
        px4:
          ipv4_address: "10.20.10.4"
      
      # restart: unless-stopped
      environment:
        DISPLAY: ${DISPLAY}
        "XAUTHORITY": ${XAUTH}
      volumes:
        - /tmp/.X11-unix/:/tmp/.X11-unix/
        - ./.qground/config/:/home/px4/.config/QGroundControl
        - ./.qground/cache/:/home/px4/.cache/QGroundControl
        - ./.qground/local/:/home/px4/.local/share/QGroundControl/
        - ./.qground/Documents/QGroundControl/Telemetry:/home/px4/Documents/QGroundControl/Telemetry
        - ./.qground/.config/:/home/px4/.config/
        # - Add bind folders to save Qground Settings and map 

      command: /bin/bash -c " cd /home/px4/ && ./QGroundControl.AppImage " 


