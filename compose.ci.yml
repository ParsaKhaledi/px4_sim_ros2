# Headless CI override: no GUI, no host port publishing, no /dev bind.
services:
  PX4:
    environment:
      HEADLESS: "1"
      DISPLAY: ""
      XAUTHORITY: ""
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      RTABMAPVIZ: "false"
      # param set after the saved bson import, before airframe set-default.
      # 0 disables the GCS datalink preflight. 1 is RC-loss Hold.
      PX4_PARAM_NAV_DLL_ACT: "0"
      PX4_PARAM_NAV_RCL_ACT: "1"
      PX4_PARAM_COM_RC_IN_MODE: "1"
      PX4_PARAM_COM_RC_LOSS_T: "35"
    ports: !override []
    volumes: !override
      - ./HealthCheck:/home/px4/volume/HealthCheck
      - ./includes/gz:/home/px4/volume/includes/gz
      - ./includes/gz/startFiles:/home/px4/volume/startFiles
      - ./includes/gz/Params:/home/px4/volume/Params
      - ./logs:/home/px4/volume/logs
      - ./tests:/home/px4/volume/tests:ro
      - ./ros2_ws:/home/px4/volume/ros2_ws:ro
  StatePublisher:
    environment:
      HEADLESS: "1"
      DISPLAY: ""
      RTABMAPVIZ: "false"
    volumes: !override
      - ./HealthCheck:/home/px4/volume/HealthCheck
      - ./includes/gz:/home/px4/volume/includes/gz
      - ./includes/gz/startFiles:/home/px4/volume/startFiles
      - ./includes/gz/Params:/home/px4/volume/Params
      - ./logs:/home/px4/volume/logs
  Rtabmap:
    environment:
      HEADLESS: "1"
      DISPLAY: ""
      RTABMAPVIZ: "false"
      QT_QPA_PLATFORM: offscreen
    volumes: !override
      - ./HealthCheck:/home/px4/volume/HealthCheck
      - ./includes/gz:/home/px4/volume/includes/gz
      - ./includes/gz/startFiles:/home/px4/volume/startFiles
      - ./includes/gz/Params:/home/px4/volume/Params
      - ./logs:/home/px4/volume/logs
  NAV2:
    environment:
      HEADLESS: "1"
      DISPLAY: ""
      RTABMAPVIZ: "false"
    volumes: !override
      - ./HealthCheck:/home/px4/volume/HealthCheck
      - ./includes/gz:/home/px4/volume/includes/gz
      - ./includes/gz/startFiles:/home/px4/volume/startFiles
      - ./includes/gz/Params:/home/px4/volume/Params
      - ./logs:/home/px4/volume/logs
  Qground:
    profiles: !override ["ci-disabled"]
  Nav2_Rviz:
    profiles: !override ["ci-disabled"]
