name: Setup Buildx
description: Create a Buildx builder and log in to Docker Hub when this run publishes an image.
inputs:
  push:
    description: "true when the image should be pushed"
    required: true
  username:
    description: Docker Hub user
    required: false
    default: ""
  password:
    description: Docker Hub token
    required: false
    default: ""
  registry:
    description: Registry host
    required: false
    default: docker.io
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to Docker Hub
      if: inputs.push == 'true'
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
