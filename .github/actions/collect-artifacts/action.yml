name: Collect sim artifacts
description: Upload health JSONL, container logs, rosbag, and ULog, and append the health report to the job summary.
inputs:
  name:
    description: Artifact name
    required: false
    default: sim-logs
runs:
  using: composite
  steps:
    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        if-no-files-found: ignore
        path: |
          logs/health/**
          logs/flights/**
          logs/smoke-containers.log
    - name: Health summary
      if: always()
      shell: bash
      run: |
        {
          echo "### Health report"
          ./scripts/health_report.sh || true
        } >> "${GITHUB_STEP_SUMMARY}"
