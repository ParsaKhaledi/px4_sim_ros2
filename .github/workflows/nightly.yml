name: Nightly

on:
  schedule:
    # 03:00 UTC. The camera world needs a self-hosted runner that can render.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      leg_length:
        description: Forward leg length in meters
        type: string
        default: "1.0"
      image:
        description: Image reference. Empty uses PX4_IMAGE from .env.
        type: string
        default: ""
      runner:
        description: Runner label. The camera world needs a machine that can render.
        type: string
        default: self-hosted
      suite:
        description: e2e or smoke
        type: choice
        options:
          - e2e
          - smoke
        default: e2e

permissions:
  contents: read

jobs:
  flight:
    uses: ./.github/workflows/_sim-test.yml
    with:
      suite: ${{ github.event.inputs.suite || 'e2e' }}
      image: ${{ github.event.inputs.image || '' }}
      leg_length: ${{ github.event.inputs.leg_length || '1.0' }}
      runner: ${{ github.event.inputs.runner || 'self-hosted' }}
