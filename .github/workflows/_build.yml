name: Build image

on:
  workflow_call:
    inputs:
      variant:
        description: no-gpu or gpu
        required: true
        type: string
      push:
        description: Push the image to Docker Hub
        required: false
        type: boolean
        default: false
      run_smoke:
        description: Run the headless smoke test against the image just built
        required: false
        type: boolean
        default: false
      run_flight:
        description: Fly the out-and-back mission on the loaded CPU image
        required: false
        type: boolean
        default: false
      upload_image:
        description: Save the CPU image so a later job can load it
        required: false
        type: boolean
        default: false
      reuse_image:
        description: Load the image from the build job instead of building
        required: false
        type: boolean
        default: false
      image_mode:
        description: built or pulled, from the build job
        required: false
        type: string
        default: built
    outputs:
      image_ref:
        description: Image reference that was tested
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: Manifest digest from buildx metadata
        value: ${{ jobs.build.outputs.image_digest }}
      image_mode:
        description: built or pulled
        value: ${{ jobs.build.outputs.image_mode }}
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: ${{ inputs.run_flight && 'flight_test' || 'build' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.run_flight && 40 || 50 }}
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.image_digest }}
      image_mode: ${{ steps.build.outputs.image_mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        if: ${{ !inputs.reuse_image }}
        uses: ./.github/actions/setup-buildx-login
        with:
          push: ${{ inputs.push == true && 'true' || 'false' }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo apt-get clean
          docker buildx prune -f || true

      - name: Image tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ inputs.variant }}" = "gpu" ]; then
            suffix="-gpu"
          else
            suffix=""
          fi
          echo "image_ref=px4_sim:ci-${GITHUB_SHA}${suffix}" >> "${GITHUB_OUTPUT}"

      # flight_test sets reuse_image and must not run this step.
      - name: Build or pull
        id: build
        if: ${{ !inputs.reuse_image }}
        timeout-minutes: 45
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source versions.env
          # shellcheck disable=SC1091
          source .env
          set +a
          start="$(date +%s)"
          image_ref="${{ steps.meta.outputs.image_ref }}"
          if [ "${{ inputs.variant }}" = "gpu" ]; then
            mode="build"
            changed=""
          elif [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags --depth=1 origin "${GITHUB_BASE_REF}"
            range="origin/${GITHUB_BASE_REF}...HEAD"
            if ! changed="$(git diff --name-only "${range}")"; then
              mode="build"
            else
              mode="$(printf '%s\n' "${changed}" | python3 scripts/image_rebuild_paths.py)"
            fi
          elif ! changed="$(git diff --name-only HEAD~1..HEAD)"; then
            mode="build"
          else
            mode="$(printf '%s\n' "${changed}" | python3 scripts/image_rebuild_paths.py)"
          fi
          echo "Image plan: ${mode}"
          echo "Changed paths:"
          printf '%s\n' "${changed:-<none>}"
          if [ "${mode}" = "pull" ]; then
            docker pull "${PX4_IMAGE}"
            docker tag "${PX4_IMAGE}" "${image_ref}"
            echo "image_mode=pulled" >> "${GITHUB_OUTPUT}"
            echo "image_digest=" >> "${GITHUB_OUTPUT}"
            echo "pull $(( $(date +%s) - start ))" > "${RUNNER_TEMP}/image_timing.txt"
            {
              echo "### Image"
              echo "- plan: pull \`${PX4_IMAGE}\`"
              echo "- ref: \`${image_ref}\`"
              echo "- flight_test loads this tag and does not build."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          short="${GITHUB_SHA::7}"
          if [ "${{ inputs.variant }}" = "gpu" ]; then
            dockerfile="dockerFile/Dockerfile_px4_sim_with_GPU"
            cache_scope="px4-sim-gpu"
            suffix="-gpu"
            qgc="${QGC_URL_GPU}"
            extra_args=(
              --build-arg "CUDA_ARCH_BIN=${CUDA_ARCH_BIN}"
              --build-arg "CUDA_ARCH_PTX=${CUDA_ARCH_PTX}"
              --build-arg "WITH_CUDA_OPENCV=${WITH_CUDA_OPENCV}"
              --build-arg "OPENCV_VERSION=${OPENCV_VERSION}"
            )
          else
            dockerfile="dockerFile/Dockerfile_px4_sim_NO_GPU"
            cache_scope="px4-sim-no-gpu"
            suffix=""
            qgc="${QGC_URL_NO_GPU}"
            extra_args=()
          fi
          local_tag="px4_sim:ci-${GITHUB_SHA}${suffix}"
          tags=(-t "${local_tag}")
          if [ "${{ inputs.push }}" = "true" ]; then
            publish_ref="${REGISTRY}/${IMAGE_NAME}:px4-${PX4_VERSION}${suffix}"
            tags+=(-t "${publish_ref}" -t "${REGISTRY}/${IMAGE_NAME}:sha-${short}${suffix}")
            output_flags=(--push)
          else
            output_flags=(--load)
          fi
          docker buildx build \
            --file "${dockerfile}" \
            --build-arg "PX4_VERSION=${PX4_VERSION}" \
            --build-arg "XRCE_AGENT_VERSION=${XRCE_AGENT_VERSION}" \
            --build-arg "ROS_DISTRO=${ROS_DISTRO}" \
            --build-arg "USER_UID=${USER_UID}" \
            --build-arg "USER_GID=${USER_GID}" \
            --build-arg "QGC_URL=${qgc}" \
            "${extra_args[@]}" \
            "${tags[@]}" \
            "${output_flags[@]}" \
            --cache-from "type=gha,scope=${cache_scope}" \
            --cache-to "type=gha,scope=${cache_scope},mode=max" \
            --metadata-file /tmp/build-metadata.json \
            --provenance=false \
            --sbom=false \
            .
          digest="$(python3 -c 'import json; print(json.load(open("/tmp/build-metadata.json")).get("containerimage.digest",""))')"
          if [ "${{ inputs.push }}" = "true" ] && [ -n "${digest}" ]; then
            image_ref="${REGISTRY}/${IMAGE_NAME}@${digest}"
            docker pull "${image_ref}"
            docker tag "${image_ref}" "${local_tag}"
          fi
          echo "image_mode=built" >> "${GITHUB_OUTPUT}"
          echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "build $(( $(date +%s) - start ))" > "${RUNNER_TEMP}/image_timing.txt"
          {
            echo "### Image"
            echo "- plan: build"
            echo "- ref: \`${local_tag}\`"
            echo "- digest: \`${digest}\`"
            echo "- flight_test loads this artifact and does not build."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save image
        if: inputs.upload_image && steps.build.outputs.image_mode == 'built'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          start="$(date +%s)"
          docker save "${{ steps.meta.outputs.image_ref }}" \
            | zstd -T0 -1 -o "${RUNNER_TEMP}/px4-image.tar.zst"
          echo "save $(( $(date +%s) - start ))" >> "${RUNNER_TEMP}/image_timing.txt"
          ls -lh "${RUNNER_TEMP}/px4-image.tar.zst"

      - name: Upload image
        if: inputs.upload_image && steps.build.outputs.image_mode == 'built'
        uses: actions/upload-artifact@v4
        with:
          name: px4-image-${{ github.sha }}
          path: ${{ runner.temp }}/px4-image.tar.zst
          compression-level: 0
          retention-days: 1

      - name: Download image
        if: inputs.reuse_image && inputs.image_mode == 'built'
        uses: actions/download-artifact@v4
        with:
          name: px4-image-${{ github.sha }}
          path: ${{ runner.temp }}/px4-image

      - name: Load image
        id: load_built
        if: inputs.reuse_image && inputs.image_mode == 'built'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zstd
          start="$(date +%s)"
          zstd -d "${RUNNER_TEMP}/px4-image/px4-image.tar.zst" -c | docker load
          echo "load $(( $(date +%s) - start ))" > "${RUNNER_TEMP}/image_timing.txt"
          docker image inspect "${{ steps.meta.outputs.image_ref }}" >/dev/null
          echo "Loaded ${{ steps.meta.outputs.image_ref }} without building."

      - name: Pull published image
        id: load_pulled
        if: inputs.reuse_image && inputs.image_mode == 'pulled'
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source .env
          set +a
          start="$(date +%s)"
          docker pull "${PX4_IMAGE}"
          docker tag "${PX4_IMAGE}" "${{ steps.meta.outputs.image_ref }}"
          echo "pull $(( $(date +%s) - start ))" > "${RUNNER_TEMP}/image_timing.txt"
          echo "Pulled ${PX4_IMAGE} without building."

      - name: Image contents
        if: >-
          steps.build.outcome == 'success' ||
          steps.load_built.outcome == 'success' ||
          steps.load_pulled.outcome == 'success'
        run: ./scripts/image_assert.sh "${{ steps.meta.outputs.image_ref }}"

      - name: Parameter names
        if: >-
          !inputs.reuse_image && inputs.variant == 'no-gpu' &&
          steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          docker run --rm --entrypoint bash "${{ steps.meta.outputs.image_ref }}" -lc '
            found=$(find /home/px4/PX4-Autopilot/build/px4_sitl_default -maxdepth 3 \
              \( -name parameters.xml -o -name parameters.json \) | head -1)
            if [ -z "${found}" ]; then
              echo "No parameters.xml or parameters.json in the image." >&2
              exit 1
            fi
            echo "metadata: ${found}" >&2
            cat "${found}"
          ' > /tmp/parameters.metadata
          python3 scripts/px4_params.py check-metadata --metadata /tmp/parameters.metadata

      - name: Headless smoke
        if: inputs.run_smoke
        timeout-minutes: 15
        env:
          PX4_IMAGE: ${{ steps.meta.outputs.image_ref }}
          HEADLESS: "1"
          RTABMAPVIZ: "false"
          DISPLAY: ""
          SMOKE_TEST_TIMEOUT: "240"
          COMPOSE_PROJECT_NAME: px4-smoke-${{ github.run_id }}
        run: ./scripts/smoke_test.sh "${PX4_IMAGE}"

      - name: Collect artifacts
        if: always() && inputs.run_smoke
        uses: ./.github/actions/collect-artifacts
        with:
          name: smoke-${{ inputs.variant }}-${{ github.sha }}

      - name: Flight test (plain x500)
        id: flight_x500
        if: >-
          inputs.run_flight && inputs.variant == 'no-gpu' &&
          (steps.build.outcome == 'success' ||
           steps.load_built.outcome == 'success' ||
           steps.load_pulled.outcome == 'success')
        timeout-minutes: 15
        env:
          PX4_IMAGE: px4_sim:ci-${{ github.sha }}
          HEADLESS: "1"
          RTABMAPVIZ: "false"
          DISPLAY: ""
          CameraType: none
          World: default
          PX4_GZ_MODEL: x500
          COMPOSE_PROFILES: ""
          COMPOSE_SERVICES: PX4
          COMPOSE_PROJECT_NAME: px4-${{ github.run_id }}-x500
          E2E_LEG_LENGTH_M: "0.3"
          E2E_MAX_RETRIES: "2"
          E2E_CHECK_CAMERAS: "0"
          E2E_WALL_SCALE: "1"
          E2E_ATTEMPT_TIMEOUT: "480"
          E2E_TOTAL_TIMEOUT: "720"
          GZ_HEADLESS_RENDERING: "0"
          GZ_USE_XVFB: "0"
          E2E_FLIGHT_DIR: ${{ github.workspace }}/logs/flights/x500
          SMOKE_TEST_TIMEOUT: "240"
        run: ./scripts/run_e2e.sh

      - name: Readback gate rejects a wrong value
        if: always() && !cancelled() && inputs.run_flight && inputs.variant == 'no-gpu'
        run: |
          set -euo pipefail
          if [ ! -s logs/px4_param_show.txt ]; then
            if [ "${{ steps.flight_x500.outcome }}" = "success" ]; then
              echo "The flight passed without a param show capture." >&2
              exit 1
            fi
            echo "No live param show. The flight did not reach readback."
            exit 0
          fi
          if python3 scripts/check_px4_params.py --override NAV_DLL_ACT=99 < logs/px4_param_show.txt; then
            echo "The readback gate accepted NAV_DLL_ACT 99." >&2
            exit 1
          fi
          echo "Readback gate rejected a wrong NAV_DLL_ACT from the live boot."

      # Non-blocking until the camera model link is camera_link.
      # The plain x500 step above is the required flight gate.
      - name: Flight test (x500_depth, software rendering)
        if: >-
          always() && !cancelled() && inputs.run_flight &&
          inputs.variant == 'no-gpu' &&
          (steps.build.outcome == 'success' ||
           steps.load_built.outcome == 'success' ||
           steps.load_pulled.outcome == 'success')
        continue-on-error: true
        timeout-minutes: 15
        env:
          PX4_IMAGE: px4_sim:ci-${{ github.sha }}
          HEADLESS: "1"
          RTABMAPVIZ: "false"
          DISPLAY: ""
          CameraType: rgbd
          World: default
          PX4_GZ_MODEL: x500_depth
          COMPOSE_PROFILES: ""
          COMPOSE_SERVICES: PX4
          COMPOSE_PROJECT_NAME: px4-${{ github.run_id }}-depth
          E2E_LEG_LENGTH_M: "0.3"
          E2E_MAX_RETRIES: "2"
          E2E_CHECK_CAMERAS: "1"
          E2E_WALL_SCALE: "3"
          E2E_ATTEMPT_TIMEOUT: "480"
          E2E_TOTAL_TIMEOUT: "720"
          E2E_FLIGHT_DIR: ${{ github.workspace }}/logs/flights/camera
          GZ_HEADLESS_RENDERING: "1"
          GZ_USE_XVFB: "0"
          GZ_CAMERA_UPDATE_RATE: "10"
          VISION_PROFILE: cpu
          HEALTH_CAMERA_MIN_HZ: "1"
          SMOKE_TEST_TIMEOUT: "300"
        run: |
          echo "Camera flight is non-blocking. It waits on PR #20's camera models (link name camera_link)."
          ./scripts/run_e2e.sh

      - name: Flight artifacts
        if: always() && !cancelled() && inputs.run_flight && inputs.variant == 'no-gpu'
        uses: ./.github/actions/collect-artifacts
        with:
          name: flight-${{ github.sha }}

      - name: Timing summary
        if: always()
        run: |
          {
            echo "### Timing"
            echo
            if [ -f "${RUNNER_TEMP}/image_timing.txt" ]; then
              echo "Image step seconds (name, then wall time):"
              echo
              echo '```'
              cat "${RUNNER_TEMP}/image_timing.txt"
              echo '```'
            fi
            if [ -f logs/timing.txt ]; then
              echo
              echo '```'
              cat logs/timing.txt
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
