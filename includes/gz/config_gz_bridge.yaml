# BNO086 on the camera. The SDF topic is absolute (/imu) so Gazebo does not
# prefix it with the model scope. RTAB-Map's imu_topic is this same name.
- ros_topic_name: "/imu"
  gz_topic_name:  "/imu"
  ros_type_name:  "sensor_msgs/msg/Imu"
  gz_type_name:   "gz.msgs.IMU"
  direction:      "GZ_TO_ROS"

- ros_topic_name: "/clock"
  gz_topic_name:  "/clock"
  ros_type_name:  "rosgraph_msgs/msg/Clock"
  gz_type_name:   "gz.msgs.Clock"
  direction:      "GZ_TO_ROS"
