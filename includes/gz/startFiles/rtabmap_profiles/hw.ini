; VISION_PROFILE=hw. Modest onboard computer (LattePanda or Jetson Orin NX)
; with a real OAK-D S2. Feature count and the local map sit between cpu and
; full. VisKeyFrameThr 40 keeps a frame from becoming a keyframe on every
; update; the library default of 150 is above typical inliers. Not yet
; measured on hardware. No extra grid decimation, detection-rate cap, or
; disparity search. On the real camera, RGB-D uses on-device depth and is
; the lighter host path.
[Core]
Optimizer\GravitySigma=0.1
Vis\FeatureType=10
Kp\DetectorStrategy=10
Vis\MaxFeatures=600
Vis\MinInliers=20
Kp\MaxFeatures=400
Grid\MapFrameProjection=true
Grid\NormalsSegmentation=false
RGBD\StartAtOrigin=true
Odom\Strategy=0
Odom\ResetCountdown=1
Odom\VisKeyFrameThr=40
OdomF2M\MaxSize=1500
Vis\CorGuessWinSize=40
Vis\EstimationType=1
