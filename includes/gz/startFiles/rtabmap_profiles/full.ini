; VISION_PROFILE=full. Standard RTAB-Map parameters. Stereo size is chosen
; separately (1280x800 by default) and is not stored in this file.
; Odom/VisKeyFrameThr is left at the library default (150) on purpose.
[Core]
Optimizer\GravitySigma=0.1
Vis\FeatureType=10
Kp\DetectorStrategy=10
Vis\MaxFeatures=1000
Vis\MinInliers=20
Grid\MapFrameProjection=true
Grid\NormalsSegmentation=false
RGBD\StartAtOrigin=true
Odom\Strategy=0
Odom\ResetCountdown=1
OdomF2M\MaxSize=2000
Vis\CorGuessWinSize=40
Vis\EstimationType=1
