; VISION_PROFILE=cpu. Same values the stereo launch used to pass on the
; command line, including Odom/VisKeyFrameThr 30. Camera-mode keys
; (ground height, Stereo/MaxDisparity, Vis/DepthAsMask, the wrapper grid)
; stay on the command line because they differ for stereo and RGB-D.
; This set is for CPU-only simulation and CI, not for a real OAK-D.
[Core]
Optimizer\GravitySigma=0.1
Vis\FeatureType=10
Kp\DetectorStrategy=10
Vis\MaxFeatures=400
Vis\MinInliers=15
Kp\MaxFeatures=300
Grid\MapFrameProjection=true
Grid\NormalsSegmentation=false
Grid\CellSize=0.1
Grid\RangeMax=5
Rtabmap\DetectionRate=1
RGBD\StartAtOrigin=true
Odom\Strategy=0
Odom\ResetCountdown=1
Odom\VisKeyFrameThr=30
OdomF2M\MaxSize=1000
Vis\CorGuessWinSize=20
Vis\EstimationType=1
