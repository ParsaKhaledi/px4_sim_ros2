# Single-file GPU entrypoint. Service bodies live in compose.yml.
# Equivalent to: docker compose -f compose.yml -f compose.gpu.yml -f compose.gui.yml

x-gpu-image: &gpu-image ${PX4_GPU_IMAGE:-docker.io/alienkh/px4_sim:${px4GPUTAG:-1.17.0_01_GPU_GPUEnabled}}

x-gpu-env: &gpu-env
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: all

x-gpu-deploy: &gpu-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: all
          capabilities: [gpu]

services:
  PX4:
    extends:
      file: compose.yml
      service: PX4
    image: *gpu-image
    environment:
      <<: *gpu-env
    deploy: *gpu-deploy
  StatePublisher:
    extends:
      file: compose.yml
      service: StatePublisher
    image: *gpu-image
    environment:
      <<: *gpu-env
  Qground:
    extends:
      file: compose.yml
      service: Qground
    image: *gpu-image
    environment:
      <<: *gpu-env
  Rtabmap:
    extends:
      file: compose.yml
      service: Rtabmap
    image: *gpu-image
    environment:
      <<: *gpu-env
  NAV2:
    extends:
      file: compose.yml
      service: NAV2
    image: *gpu-image
    environment:
      <<: *gpu-env
  Nav2_Rviz:
    extends:
      file: compose.yml
      service: Nav2_Rviz
    image: *gpu-image
    environment:
      <<: *gpu-env

networks:
  px4:
    ipam:
      driver: default
      config:
        - subnet: 10.20.10.0/24
